<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>药品仓储状态监测</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: #f5f7fa;
            color: #303133;
        }

        body {
            margin: 0;
            padding: 40px 20px;
        }

        .page {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
        }

        .refresh-btn {
            padding: 9px 18px;
            border: 0;
            border-radius: 6px;
            background: #409eff;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }

        .refresh-btn:hover {
            background: #66b1ff;
        }

        .refresh-btn:disabled {
            cursor: wait;
            opacity: 0.65;
        }

        .status {
            min-height: 24px;
            margin-bottom: 12px;
            color: #606266;
            font-size: 14px;
        }

        .status.error {
            color: #f56c6c;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 2px 12px rgb(0 0 0 / 8%);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border-bottom: 1px solid #ebeef5;
            padding: 14px 12px;
            text-align: center;
        }

        th {
            background: #f2f6fc;
            font-weight: 600;
        }

        tbody tr:hover {
            background: #f9fbff;
        }

        .danger {
            color: #f56c6c;
            font-weight: 700;
        }

        .empty {
            color: #909399;
        }

        @media (max-width: 600px) {
            body {
                padding: 24px 12px;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
<main class="page">
    <div class="header">
        <h1>药品仓储状态监测</h1>
        <button id="refresh-button" class="refresh-btn" type="button">刷新</button>
    </div>

    <div id="status" class="status" aria-live="polite"></div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>药品名称</th>
                    <th>温度（℃）</th>
                    <th>湿度（%）</th>
                    <th>重量（g）</th>
                </tr>
            </thead>
            <tbody id="meds-table-body"></tbody>
        </table>
    </div>
</main>

<script>
    const API_URL = "/api/meds";
    const MAX_ITEMS = 24;
    const TEMP_MIN = 2;
    const TEMP_MAX = 20;
    const HUMIDITY_MIN = 30;
    const HUMIDITY_MAX = 70;
    const WEIGHT_MIN = 50;

    const tableBody = document.getElementById("meds-table-body");
    const status = document.getElementById("status");
    const refreshButton = document.getElementById("refresh-button");

    function appendCell(row, value, isDanger = false) {
        const cell = document.createElement("td");
        cell.textContent = value;
        if (isDanger) {
            cell.classList.add("danger");
        }
        row.appendChild(cell);
    }

    async function loadMeds() {
        refreshButton.disabled = true;
        status.classList.remove("error");
        status.textContent = "正在获取数据……";

        try {
            const response = await fetch(API_URL, { cache: "no-store" });
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();
            if (!Array.isArray(data)) {
                throw new Error("接口返回格式错误");
            }

            tableBody.replaceChildren();
            const meds = data.slice(0, MAX_ITEMS);

            if (meds.length === 0) {
                const row = document.createElement("tr");
                const cell = document.createElement("td");
                cell.colSpan = 4;
                cell.className = "empty";
                cell.textContent = "暂无药品数据";
                row.appendChild(cell);
                tableBody.appendChild(row);
            } else {
                meds.forEach((med) => {
                    const row = document.createElement("tr");
                    appendCell(row, med.name);
                    appendCell(row, med.temp, med.temp < TEMP_MIN || med.temp > TEMP_MAX);
                    appendCell(
                        row,
                        med.humidity,
                        med.humidity < HUMIDITY_MIN || med.humidity > HUMIDITY_MAX,
                    );
                    appendCell(row, med.weight, med.weight < WEIGHT_MIN);
                    tableBody.appendChild(row);
                });
            }

            status.textContent = `共 ${meds.length} 条数据，更新于 ${new Date().toLocaleString()}`;
        } catch (error) {
            status.classList.add("error");
            status.textContent = "获取药品数据失败，请检查 API 服务是否正常运行。";
            console.error(error);
        } finally {
            refreshButton.disabled = false;
        }
    }

    refreshButton.addEventListener("click", loadMeds);
    window.addEventListener("load", loadMeds);
</script>
</body>
</html>
